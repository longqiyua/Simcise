<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simcise Design System</title>
<meta name="description" content="Simple × Concise — 产品级 UI 设计系统">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAFAF8;--surface:#FFFFFF;--text:#1A1A1A;--text-secondary:#666;--text-muted:#999;--accent:#1A6B66;--accent-glow:rgba(26,107,102,0.15);--border:#E5E5E5;--ease:cubic-bezier(0.4,0,0.2,1)}
html{font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
.container{max-width:640px;width:100%;text-align:center}
h1{font-size:2.4rem;font-weight:700;letter-spacing:-0.03em;margin-bottom:8px}
h1 span{color:var(--accent)}
.tagline{font-size:1rem;color:var(--text-secondary);margin-bottom:48px;font-weight:400}
.tagline em{font-style:normal;color:var(--accent);font-weight:500}
.principles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:48px;text-align:left}
.principle{padding:16px 20px;border-radius:12px;border:1px solid var(--border);background:var(--surface);transition:all 200ms var(--ease)}
.principle:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px var(--accent-glow)}
.principle b{display:block;font-size:0.85rem;color:var(--accent);margin-bottom:4px;font-weight:600}
.principle span{font-size:0.8rem;color:var(--text-secondary);line-height:1.5}
.actions{display:flex;gap:12px;justify-content:center;margin-bottom:48px}
.btn{display:inline-flex;align-items:center;padding:12px 32px;border-radius:12px;font-size:0.9rem;font-weight:500;text-decoration:none;border:1px solid transparent;transition:all 200ms var(--ease);cursor:pointer}
.btn-primary{background:var(--accent);color:#fff;border-color:#145551}
.btn-primary:hover{box-shadow:0 4px 20px var(--accent-glow);transform:translateY(-1px)}
.btn-secondary{background:transparent;border-color:var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.meta{font-size:0.75rem;color:var(--text-muted);line-height:1.8}
.meta a{color:var(--text-secondary);text-decoration:none;border-bottom:1px solid var(--border)}
.meta a:hover{color:var(--accent);border-color:var(--accent)}
@media(max-width:600px){.principles{grid-template-columns:1fr}.actions{flex-direction:column}h1{font-size:1.8rem}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.container>*{animation:fadeUp 600ms var(--ease) both}
.container>*:nth-child(2){animation-delay:80ms}
.container>*:nth-child(3){animation-delay:160ms}
.container>*:nth-child(4){animation-delay:240ms}
.container>*:nth-child(5){animation-delay:320ms}
</style>
</head>
<body>
<div class="container">
  <h1><span>Simcise</span> Design System</h1>
  <p class="tagline">Simple × Concise — 界面在你不需要它的时候<em>消失</em>，在你需要它的时候<em>生长</em>出来。</p>

  <div class="principles">
    <div class="principle"><b>Breathing</b><span>元素有微妙的生命节奏，永不安静也永不焦虑</span></div>
    <div class="principle"><b>Fluid Morph</b><span>元素原地变形，不销毁重建</span></div>
    <div class="principle"><b>Zero Dialogs</b><span>绝对禁止弹窗，一切通过卡片延展实现</span></div>
    <div class="principle"><b>Ceramic Warmth</b><span>暖渐变 + 内高光 + 柔光阴影，触感如釉面陶瓷</span></div>
  </div>

  <div class="actions">
    <a class="btn btn-primary" href="Display.html">View Design System</a>
    <a class="btn btn-secondary" href="https://github.com/longqiyua/Simcise">GitHub</a>
  </div>

  <div class="meta">
    <a href="https://github.com/longqiyua/Simcise/blob/main/SKILL.md">SKILL.md</a> ·
    <a href="https://github.com/longqiyua/Simcise/blob/main/Lesong%20Art%EF%BC%9ASimcise%20%E8%AE%BE%E8%AE%A1%E8%A7%84%E8%8C%83.md">Full Spec</a> ·
    <a href="https://github.com/longqiyua/Simcise/blob/main/CHANGELOG.md">Changelog</a><br>
    MIT License &copy; 2026 longqiyua
  </div>
</div>
</body>
</html>
